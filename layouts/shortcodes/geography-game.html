<style>
.geography-game {
  max-width: 600px;
  margin: 2rem auto;
  padding: 1.5rem;
  border-radius: 8px;
  background: var(--sidebar-bg, #f8f9fa);
  border: 1px solid var(--article-border, #dee2e6);
  font-family: inherit;
}

.geography-game h3 {
  margin: 0 0 1rem 0;
  text-align: center;
  color: var(--heading-color, #212529);
}

.game-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 1.5rem;
  padding: 0.75rem;
  background: var(--article-bg, #fff);
  border-radius: 6px;
  font-size: 0.9rem;
}

.game-stats span {
  color: var(--article-text, #495057);
}

.game-stats .score {
  font-weight: bold;
  color: var(--link-color, #0066cc);
}

.question-container {
  text-align: center;
  margin-bottom: 1.5rem;
}

.question-container p {
  font-size: 1.1rem;
  margin-bottom: 0.5rem;
  color: var(--article-text, #495057);
}

.country-name {
  font-size: 1.5rem;
  font-weight: bold;
  color: var(--heading-color, #212529);
  margin: 0;
}

.options-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.75rem;
  margin-bottom: 1.5rem;
}

.option-btn {
  padding: 0.875rem 1rem;
  border: 2px solid var(--article-border, #dee2e6);
  border-radius: 6px;
  background: var(--article-bg, #fff);
  color: var(--article-text, #212529);
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.2s ease;
}

.option-btn:hover:not(:disabled) {
  border-color: var(--link-color, #0066cc);
  background: var(--sidebar-bg, #f8f9fa);
}

.option-btn:disabled {
  cursor: not-allowed;
}

.option-btn.correct {
  background: #d4edda;
  border-color: #28a745;
  color: #155724;
}

.option-btn.incorrect {
  background: #f8d7da;
  border-color: #dc3545;
  color: #721c24;
}

.feedback {
  text-align: center;
  padding: 1rem;
  border-radius: 6px;
  margin-bottom: 1rem;
  font-weight: 500;
}

.feedback.correct {
  background: #d4edda;
  color: #155724;
}

.feedback.incorrect {
  background: #f8d7da;
  color: #721c24;
}

.feedback.hidden {
  display: none;
}

.game-controls {
  display: flex;
  justify-content: center;
  gap: 1rem;
}

.game-btn {
  padding: 0.75rem 1.5rem;
  border: none;
  border-radius: 6px;
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.2s ease;
}

.next-btn {
  background: var(--link-color, #0066cc);
  color: #fff;
}

.next-btn:hover {
  opacity: 0.9;
}

.next-btn:disabled {
  background: var(--article-border, #dee2e6);
  cursor: not-allowed;
}

.restart-btn {
  background: var(--article-border, #dee2e6);
  color: var(--article-text, #212529);
}

.restart-btn:hover {
  background: #adb5bd;
}

.game-over {
  text-align: center;
  padding: 2rem;
}

.game-over h3 {
  margin-bottom: 1rem;
}

.final-score {
  font-size: 2rem;
  font-weight: bold;
  color: var(--link-color, #0066cc);
  margin-bottom: 0.5rem;
}

.score-message {
  color: var(--article-text, #495057);
  margin-bottom: 1.5rem;
}

.progress-bar {
  width: 100%;
  height: 8px;
  background: var(--article-border, #dee2e6);
  border-radius: 4px;
  margin-bottom: 1.5rem;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--link-color, #0066cc);
  transition: width 0.3s ease;
}

@media (max-width: 480px) {
  .options-grid {
    grid-template-columns: 1fr;
  }

  .geography-game {
    padding: 1rem;
  }
}
</style>

<div class="geography-game" id="geography-game">
  <h3>🌍 Capital Cities Quiz</h3>

  <div class="progress-bar">
    <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
  </div>

  <div class="game-stats">
    <span>Question: <span id="question-num">1</span>/10</span>
    <span>Score: <span class="score" id="score">0</span></span>
  </div>

  <div id="game-content">
    <div class="question-container">
      <p>What is the capital of</p>
      <p class="country-name" id="country-name">Loading...</p>
    </div>

    <div class="options-grid" id="options-grid">
      <!-- Options will be generated by JS -->
    </div>

    <div class="feedback hidden" id="feedback"></div>

    <div class="game-controls">
      <button class="game-btn next-btn" id="next-btn" disabled>Next Question</button>
      <button class="game-btn restart-btn" id="restart-btn">Restart</button>
    </div>
  </div>

  <div id="game-over" style="display: none;">
    <div class="game-over">
      <h3>Game Over!</h3>
      <div class="final-score" id="final-score">0/10</div>
      <p class="score-message" id="score-message"></p>
      <button class="game-btn next-btn" id="play-again-btn">Play Again</button>
    </div>
  </div>
</div>

<script>
(function() {
  // Country-capital data
  const countryCapitals = [
    { country: "France", capital: "Paris", decoys: ["Lyon", "Marseille", "Nice"] },
    { country: "Japan", capital: "Tokyo", decoys: ["Osaka", "Kyoto", "Yokohama"] },
    { country: "Australia", capital: "Canberra", decoys: ["Sydney", "Melbourne", "Brisbane"] },
    { country: "Brazil", capital: "Brasília", decoys: ["Rio de Janeiro", "São Paulo", "Salvador"] },
    { country: "Canada", capital: "Ottawa", decoys: ["Toronto", "Vancouver", "Montreal"] },
    { country: "Germany", capital: "Berlin", decoys: ["Munich", "Hamburg", "Frankfurt"] },
    { country: "Italy", capital: "Rome", decoys: ["Milan", "Venice", "Florence"] },
    { country: "Spain", capital: "Madrid", decoys: ["Barcelona", "Seville", "Valencia"] },
    { country: "India", capital: "New Delhi", decoys: ["Mumbai", "Bangalore", "Chennai"] },
    { country: "China", capital: "Beijing", decoys: ["Shanghai", "Hong Kong", "Shenzhen"] },
    { country: "South Korea", capital: "Seoul", decoys: ["Busan", "Incheon", "Daegu"] },
    { country: "Egypt", capital: "Cairo", decoys: ["Alexandria", "Giza", "Luxor"] },
    { country: "South Africa", capital: "Pretoria", decoys: ["Cape Town", "Johannesburg", "Durban"] },
    { country: "Mexico", capital: "Mexico City", decoys: ["Guadalajara", "Monterrey", "Cancún"] },
    { country: "Argentina", capital: "Buenos Aires", decoys: ["Córdoba", "Rosario", "Mendoza"] },
    { country: "Turkey", capital: "Ankara", decoys: ["Istanbul", "Izmir", "Antalya"] },
    { country: "Poland", capital: "Warsaw", decoys: ["Kraków", "Gdańsk", "Wrocław"] },
    { country: "Netherlands", capital: "Amsterdam", decoys: ["Rotterdam", "The Hague", "Utrecht"] },
    { country: "Switzerland", capital: "Bern", decoys: ["Zurich", "Geneva", "Basel"] },
    { country: "Sweden", capital: "Stockholm", decoys: ["Gothenburg", "Malmö", "Uppsala"] },
    { country: "Norway", capital: "Oslo", decoys: ["Bergen", "Trondheim", "Stavanger"] },
    { country: "Finland", capital: "Helsinki", decoys: ["Espoo", "Tampere", "Turku"] },
    { country: "Portugal", capital: "Lisbon", decoys: ["Porto", "Faro", "Coimbra"] },
    { country: "Greece", capital: "Athens", decoys: ["Thessaloniki", "Patras", "Heraklion"] },
    { country: "Thailand", capital: "Bangkok", decoys: ["Chiang Mai", "Phuket", "Pattaya"] },
    { country: "Vietnam", capital: "Hanoi", decoys: ["Ho Chi Minh City", "Da Nang", "Hue"] },
    { country: "Indonesia", capital: "Jakarta", decoys: ["Bali", "Surabaya", "Bandung"] },
    { country: "Malaysia", capital: "Kuala Lumpur", decoys: ["Penang", "Johor Bahru", "Malacca"] },
    { country: "Philippines", capital: "Manila", decoys: ["Cebu City", "Davao", "Quezon City"] },
    { country: "New Zealand", capital: "Wellington", decoys: ["Auckland", "Christchurch", "Queenstown"] },
    { country: "Ireland", capital: "Dublin", decoys: ["Cork", "Galway", "Limerick"] },
    { country: "Austria", capital: "Vienna", decoys: ["Salzburg", "Innsbruck", "Graz"] },
    { country: "Czech Republic", capital: "Prague", decoys: ["Brno", "Ostrava", "Plzeň"] },
    { country: "Hungary", capital: "Budapest", decoys: ["Debrecen", "Szeged", "Pécs"] },
    { country: "Romania", capital: "Bucharest", decoys: ["Cluj-Napoca", "Timișoara", "Iași"] },
    { country: "Chile", capital: "Santiago", decoys: ["Valparaíso", "Concepción", "Viña del Mar"] },
    { country: "Colombia", capital: "Bogotá", decoys: ["Medellín", "Cali", "Cartagena"] },
    { country: "Peru", capital: "Lima", decoys: ["Cusco", "Arequipa", "Trujillo"] },
    { country: "Kenya", capital: "Nairobi", decoys: ["Mombasa", "Kisumu", "Nakuru"] },
    { country: "Morocco", capital: "Rabat", decoys: ["Casablanca", "Marrakech", "Fes"] },
    { country: "Nigeria", capital: "Abuja", decoys: ["Lagos", "Kano", "Ibadan"] },
    { country: "Pakistan", capital: "Islamabad", decoys: ["Karachi", "Lahore", "Faisalabad"] },
    { country: "Bangladesh", capital: "Dhaka", decoys: ["Chittagong", "Khulna", "Sylhet"] },
    { country: "Ukraine", capital: "Kyiv", decoys: ["Kharkiv", "Odesa", "Lviv"] },
    { country: "Belgium", capital: "Brussels", decoys: ["Antwerp", "Ghent", "Bruges"] },
    { country: "Denmark", capital: "Copenhagen", decoys: ["Aarhus", "Odense", "Aalborg"] },
    { country: "Singapore", capital: "Singapore", decoys: ["Sentosa", "Jurong", "Tampines"] },
    { country: "Israel", capital: "Jerusalem", decoys: ["Tel Aviv", "Haifa", "Eilat"] },
    { country: "United Arab Emirates", capital: "Abu Dhabi", decoys: ["Dubai", "Sharjah", "Ajman"] },
    { country: "Saudi Arabia", capital: "Riyadh", decoys: ["Jeddah", "Mecca", "Medina"] }
  ];

  let gameState = {
    questions: [],
    currentQuestion: 0,
    score: 0,
    totalQuestions: 10,
    answered: false
  };

  // DOM elements
  const questionNum = document.getElementById('question-num');
  const scoreDisplay = document.getElementById('score');
  const countryName = document.getElementById('country-name');
  const optionsGrid = document.getElementById('options-grid');
  const feedback = document.getElementById('feedback');
  const nextBtn = document.getElementById('next-btn');
  const restartBtn = document.getElementById('restart-btn');
  const gameContent = document.getElementById('game-content');
  const gameOver = document.getElementById('game-over');
  const finalScore = document.getElementById('final-score');
  const scoreMessage = document.getElementById('score-message');
  const playAgainBtn = document.getElementById('play-again-btn');
  const progressFill = document.getElementById('progress-fill');

  // Fisher-Yates shuffle
  function shuffle(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function initGame() {
    gameState = {
      questions: shuffle(countryCapitals).slice(0, gameState.totalQuestions),
      currentQuestion: 0,
      score: 0,
      totalQuestions: 10,
      answered: false
    };

    gameContent.style.display = 'block';
    gameOver.style.display = 'none';
    updateUI();
    showQuestion();
  }

  function updateUI() {
    questionNum.textContent = gameState.currentQuestion + 1;
    scoreDisplay.textContent = gameState.score;
    progressFill.style.width = ((gameState.currentQuestion) / gameState.totalQuestions * 100) + '%';
  }

  function showQuestion() {
    const question = gameState.questions[gameState.currentQuestion];
    countryName.textContent = question.country;

    // Create options array with correct answer and 3 decoys
    const options = shuffle([question.capital, ...question.decoys.slice(0, 3)]);

    optionsGrid.innerHTML = options.map(option =>
      `<button class="option-btn" data-answer="${option}">${option}</button>`
    ).join('');

    // Add click handlers
    optionsGrid.querySelectorAll('.option-btn').forEach(btn => {
      btn.addEventListener('click', handleAnswer);
    });

    feedback.classList.add('hidden');
    nextBtn.disabled = true;
    gameState.answered = false;
  }

  function handleAnswer(e) {
    if (gameState.answered) return;

    gameState.answered = true;
    const selectedAnswer = e.target.dataset.answer;
    const correctAnswer = gameState.questions[gameState.currentQuestion].capital;
    const isCorrect = selectedAnswer === correctAnswer;

    // Disable all buttons
    optionsGrid.querySelectorAll('.option-btn').forEach(btn => {
      btn.disabled = true;
      if (btn.dataset.answer === correctAnswer) {
        btn.classList.add('correct');
      } else if (btn.dataset.answer === selectedAnswer && !isCorrect) {
        btn.classList.add('incorrect');
      }
    });

    // Show feedback
    if (isCorrect) {
      gameState.score++;
      scoreDisplay.textContent = gameState.score;
      feedback.textContent = '✓ Correct!';
      feedback.className = 'feedback correct';
    } else {
      feedback.textContent = `✗ The correct answer is ${correctAnswer}`;
      feedback.className = 'feedback incorrect';
    }
    feedback.classList.remove('hidden');

    // Enable next button or show game over
    if (gameState.currentQuestion < gameState.totalQuestions - 1) {
      nextBtn.disabled = false;
    } else {
      setTimeout(showGameOver, 1500);
    }
  }

  function nextQuestion() {
    gameState.currentQuestion++;
    updateUI();
    showQuestion();
  }

  function showGameOver() {
    gameContent.style.display = 'none';
    gameOver.style.display = 'block';
    progressFill.style.width = '100%';

    finalScore.textContent = `${gameState.score}/${gameState.totalQuestions}`;

    const percentage = (gameState.score / gameState.totalQuestions) * 100;
    if (percentage === 100) {
      scoreMessage.textContent = 'Perfect score! You\'re a geography expert!';
    } else if (percentage >= 80) {
      scoreMessage.textContent = 'Excellent! You really know your capitals!';
    } else if (percentage >= 60) {
      scoreMessage.textContent = 'Good job! Keep learning!';
    } else if (percentage >= 40) {
      scoreMessage.textContent = 'Not bad! Practice makes perfect!';
    } else {
      scoreMessage.textContent = 'Keep exploring the world!';
    }
  }

  // Event listeners
  nextBtn.addEventListener('click', nextQuestion);
  restartBtn.addEventListener('click', initGame);
  playAgainBtn.addEventListener('click', initGame);

  // Initialize game
  initGame();
})();
</script>
